<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="250" height="250">
  <!-- Background -->
  <rect width="100" height="100" fill="transparent"/>
  
  <!-- Magnifying Glass Lens & Handle -->
  <circle cx="48" cy="45" r="26" stroke="#0F6E56" stroke-width="7" fill="none"/>
  <line x1="66" y1="63" x2="84" y2="81" stroke="#0F6E56" stroke-width="8" stroke-linecap="round"/>
  
  <!-- The Central Investigation Thread -->
  <polyline points="28,52 42,52 52,36 68,36" stroke="#0F6E56" stroke-width="3" fill="none" stroke-linejoin="round"/>
  
  <!-- The Nodes (Claim, Source, Evidence, Conclusion) -->
  <circle cx="28" cy="52" r="5" fill="#D85A30"/> <!-- Initial Claim / Origin -->
  <circle cx="42" cy="52" r="3.5" fill="#0F6E56"/>
  <circle cx="52" cy="36" r="3.5" fill="#0F6E56"/>
  <circle cx="68" cy="36" r="3.5" fill="#0F6E56"/>
</svg>
